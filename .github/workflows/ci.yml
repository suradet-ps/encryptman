name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - name: Enforce no panics in library code
        run: |
          awk '
            /^[[:space:]]*\/\// { next }
            /^#\[cfg\(test\)\]/ { in_test = 1 }
            in_test && /^}/ { in_test = 0 }
            !in_test && /expect\(|unwrap\(|panic!/ { print "line " FNR ": " $0; bad = 1 }
            END {
              if (bad) {
                print "FAIL: unwrap()/expect()/panic! found in non-test, non-doc code" > "/dev/stderr"
                exit 1
              }
              print "OK: no unwrap()/expect()/panic! in library code"
            }
          ' src/lib.rs

  machete:
    name: Dead dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo machete

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - run: cargo test --all-features

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        name: Audit Rust Dependencies

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN overrides the repo's rust-toolchain.toml (channel =
    # "stable"); without it `cargo test` would silently run stable and the
    # MSRV check would be a false pass.
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.85.0
        with:
          toolchain: 1.85.0
      - run: cargo test --all-features

  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # nightly
        with:
          toolchain: nightly
          components: miri
      - name: Miri setup
        run: cargo miri setup
      # proptests are deliberately excluded from Miri: proptest's test
      # machinery itself runs orders of magnitude slower under the Miri
      # interpreter (minutes per trivial property). The zeroize/UB-relevant
      # paths are covered by the lib tests and the KATs, which include the
      # full format, tamper, and key-handling code paths.
      - name: Miri lib tests
        run: cargo miri test --lib
      - name: Miri KATs
        run: cargo miri test --test kat

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz (pinned)
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz decrypt (60s)
        working-directory: fuzz
        run: cargo fuzz run decrypt -- -max_total_time=60
      - name: Fuzz encoding (60s)
        working-directory: fuzz
        run: cargo fuzz run encoding -- -max_total_time=60
      - name: Fail on any crash artifact
        run: |
          # cargo-fuzz creates empty artifacts/<target>/ directories on
          # every run; only actual crash files are failures.
          if find fuzz/artifacts -type f | grep -q .; then
            echo "::error::crash artifacts found in fuzz/artifacts"
            find fuzz/artifacts -type f
            exit 1
          fi
