[package]
name = "encryptman"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "AES-256-GCM encryption for application settings with HKDF key derivation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suradet-ps/encryptman"
keywords = ["encryption", "aes", "gcm", "settings", "secrets"]
categories = ["cryptography", "config"]
readme = "README.md"
documentation = "https://docs.rs/encryptman"
include = ["src/**", "README.md", "LICENSE*", "CHANGELOG.md"]

[lints.rust]
missing_docs = "deny"

[dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hkdf = "0.13"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
proptest = "1"
